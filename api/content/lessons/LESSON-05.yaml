id: LESSON-05
title: 'Macrocytic Anaemia: Megaloblastic and Non-Megaloblastic Pathways'
objective_id: LO-MACROCYTIC-ETIOLOGY
status: draft
reviewed_by: null
reviewed_at: null
review_notes:
