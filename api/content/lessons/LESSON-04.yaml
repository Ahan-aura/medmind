id: LESSON-04
title: 'The Microcytic Differential: Iron Deficiency, Thalassaemia, and Chronic Disease'
objective_id: LO-MICROCYTIC-DIFFERENTIAL
status: draft
reviewed_by: null
reviewed_at: null
