id: CASE-REDALERT-01
version: 1
case_role: initial
learning_objective: LO-MUSTNOTMISS-01
paired_case: CASE-FATIGUE-01
title: "Unexplained Microcytic Anaemia in an Older Adult: Red Flag Recognition"
reviewed_by: "Curriculum Team (Educational Draft)"
reviewed_at: "2026-10-15T00:00:00Z"
disclaimer: "Fictional case for education only. Not medical advice."
patient:
  name: Harold
  age: 71
  sex: male
history: >
  Presents with 3 months of progressive lethargy, shortness of breath upon walking uphill, and an unintentional weight loss of 4 kg.
  Reports a subtle change in bowel habit towards looser stools over the last 2 months.
  Denies visible hematochezia, hematemesis, or NSAID use. Has never undergone screening colonoscopy.
labs:
  - id: hb
    test: Haemoglobin
    value: 8.7
    unit: g/dL
    ref: '13.5-17.5'
    flag: low
  - id: mcv
    test: Mean Corpuscular Volume (MCV)
    value: 70
    unit: fL
    ref: '80-100'
    flag: low
  - id: rdw
    test: Red Cell Distribution Width (RDW)
    value: 18.6
    unit: '%'
    ref: '11.5-14.5'
    flag: high
  - id: ferritin
    test: Serum Ferritin
    value: 8
    unit: ng/mL
    ref: '20-250'
    flag: low
  - id: wbc
    test: White Blood Cell Count (WBC)
    value: 7.2
    unit: x10^9/L
    ref: '4.0-11.0'
    flag: normal
  - id: platelets
    test: Platelet Count
    value: 430
    unit: x10^9/L
    ref: '150-400'
    flag: high
  - id: fobt
    test: Fecal Occult Blood Test (FOBT)
    value: Positive
    unit: qualitative
    ref: 'Negative'
    flag: high
question: "In this 71-year-old male with confirmed iron-deficiency anaemia and unintentional weight loss, what is the mandatory immediate clinical priority?"
options:
  - id: A
    text: "Escalate for urgent bidirectional gastrointestinal endoscopy to investigate occult GI blood loss and rule out gastrointestinal malignancy"
    correct: true
  - id: B
    text: "Commence oral iron therapy and schedule a routine telephone follow-up in 6 months without endoscopic investigation"
    correct: false
  - id: C
    text: "Perform urgent bone marrow aspiration to exclude primary aplastic anaemia"
    correct: false
  - id: D
    text: "Reassure the patient that microcytic indices are a benign consequence of normal biological ageing"
    correct: false
rubric:
  max_score: 10
  criteria:
    - id: C1
      points: 3
      description: "Identifies urgent bidirectional gastrointestinal endoscopy as the mandatory next step to investigate occult bleeding / malignancy"
      check:
        type: answer_is
        value: A
    - id: C2
      points: 2
      description: "Recognises severely depleted serum ferritin (8 ng/mL) and low MCV confirming genuine iron-deficiency anaemia"
      check:
        type: evidence_includes
        ids: [ferritin]
    - id: C3
      points: 2
      description: "Cites positive fecal occult blood test and unintentional weight loss as red-flag indicators of occult GI blood loss"
      check:
        type: evidence_includes
        ids: [fobt]
    - id: C4
      points: 1
      description: "Notes microcytosis (MCV 70 fL) with high RDW demonstrating significant anisocytosis"
      check:
        type: evidence_includes
        ids: [mcv]
    - id: C5
      points: 2
      description: "Clinical reasoning articulates that finding the cause of IDA in older adults is mandatory and cannot be deferred with iron alone"
      check:
        type: keywords_any
        groups:
          - [endoscopy, colonoscopy, gastrointestinal, gi, occult, malignancy]
          - [urgent, escalate, blood loss, red flag, weight loss, cause]
misconception_rules:
  - id: MC-MISSED-DANGEROUS-ALTERNATIVE
    when:
      answer_in: [B, D]
  - id: MC-PREMATURE-CLOSURE
    when:
      answer_in: [B]
  - id: MC-WASTEFUL-TESTING
    when:
      answer_in: [C]
  - id: MC-OVERCONFIDENT
    when:
      confidence_gte: 80
      is_correct: false
branching:
  start: n_review
  nodes:
    - id: n_review
      type: review_case
      text: "You are reviewing Harold's clinical presentation. What diagnostic investigation would you like to review next?"
      choices:
        - id: more_info
          label: "Request peripheral blood smear analysis"
          next: n_smear
        - id: answer_now
          label: "Proceed immediately to diagnostic interpretation"
          next: n_decide
          flags: [jumped_early]
    - id: n_smear
      type: reveal
      text: "Peripheral blood smear shows severe microcytic, hypochromic red blood cells with marked anisopoikilocytosis and occasional pencil-shaped elliptocytes. Platelet count is elevated (reactive thrombocytosis in response to chronic blood loss)."
      choices:
        - id: continue
          label: "Synthesize findings & enter decision"
          next: n_decide
    - id: n_decide
      type: decision
      text: "Formulate your clinical interpretation, select key evidence, and record your reasoning."
allowed_references:
  - REF-REDALERT-001
  - REF-REDALERT-002
  - REF-IDA-001
  - REF-FERRITIN-001
  - REF-TESTING-001
fallback_feedback_key: FB-REDALERT-01
i18n:
  te:
    title: "వృద్ధులలో వివరించలేని సూక్ష్మకణ రక్తహీనత: ప్రమాద హెచ్చరికల గుర్తింపు (Unexplained Microcytic Anaemia in an Older Adult: Red Flag Recognition)"
    patient:
      name: "హెరాల్డ్ (Harold)"
    question: "ధృవీకరించబడిన ఇనుము లోపం మరియు వివరించలేని బరువు తగ్గుదల ఉన్న ఈ 71 ఏళ్ల పురుషుడికి అత్యవసర క్లినికల్ ప్రాధాన్యత ఏమిటి?"
